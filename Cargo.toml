[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/naazimsnh02/strikecut"
rust-version = "1.80"

[workspace.dependencies]
strikecut-core = { path = "crates/core" }
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3.27.0"
whisper-rs = "0.16.0"
ureq = "3.4.2"
sha2 = "0.10.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
