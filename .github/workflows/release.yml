name: Release

# Push a tag like v0.1.0 to build installers and CLI archives for every platform into a draft GitHub release.
# Run it manually (Actions > Release > Run workflow) to build everything as workflow artifacts without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Build whisper.cpp for a portable baseline (AVX2 on x86) instead of the CI machine's exact CPU.
  GGML_NATIVE: "OFF"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libssl-dev patchelf file cmake clang libclang-dev
      - name: Point bindgen at LLVM (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - name: Fetch ffmpeg
        shell: bash
        run: scripts/fetch-ffmpeg.sh ${{ matrix.target }}

      - name: Build desktop app
        working-directory: app
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --features whisper --config src-tauri/tauri.bundle.conf.json

      - name: Build CLI
        run: cargo build --release -p strikecut --features whisper

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="dev-${GITHUB_SHA::7}"
          target=${{ matrix.target }}
          exe=""; [ "${{ runner.os }}" = Windows ] && exe=.exe
          mkdir -p dist

          # Installers. Tauri names them by product, version and arch, so they don't collide across jobs.
          shopt -s nullglob
          for f in target/release/bundle/{nsis/*.exe,msi/*.msi,dmg/*.dmg,deb/*.deb,rpm/*.rpm,appimage/*.AppImage}; do
            cp "$f" dist/
          done

          # CLI archive: strikecut plus the same ffmpeg the app bundles.
          name="strikecut-cli-$version-$target"
          mkdir -p "$name"
          cp "target/release/strikecut$exe" "$name/"
          for tool in ffmpeg ffprobe; do
            cp "app/src-tauri/binaries/strikecut-$tool-$target$exe" "$name/strikecut-$tool$exe"
          done
          cp LICENSE README.md app/src-tauri/binaries/FFMPEG-NOTICE.txt "$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            7z a -tzip "dist/$name.zip" "$name" >/dev/null
          else
            tar -czf "dist/$name.tar.gz" "$name"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: strikecut-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match app version $version"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --generate-notes --title "Strikecut $GITHUB_REF_NAME"
